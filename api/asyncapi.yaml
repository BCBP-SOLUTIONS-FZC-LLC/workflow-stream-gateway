asyncapi: 3.0.0
info:
  title: workflow-stream-gateway events
  version: 1.0.0
  description: >
    Inbound only. Each publishing service's event consumer forwards its events,
    unchanged, to POST /api/v1/internal/events: the shared Workflow-Events Consumer
    for the Workflow Execution Service, and the LLM subsystem's own consumer for
    its generation events. Which events are rendered comes from the routing file
    (config/routing.yaml), keyed by the envelope source, then the event type; the
    channels below are its sections. A pair of source and type the routing file
    does not list is acknowledged with 200 and ignored. Every routed payload names
    its readers in `recipients`, a list of {kind, id}: a `user` entry reaches that
    user's streams in the envelope's tenant, a `department` entry reaches the
    streams whose ticket carries that department. A service whose section sets
    tenant_admins also reaches the tenant's administrators (the workflow section
    does, the llm section does not). Payload schemas are owned and registered by
    the producing service; only the fields this service reads are stated here.
    Each event reaches the browser as the SSE event `<service>.<type>`, for example
    `workflow.WorkflowTaskCreated` or `llm.GenerationProgressed`. This service
    publishes no events.

channels:
  wf/workflow/dash:
    address: wf-workflow-dash-q
    description: >
      Section workflow (source workflow-execution-svc). Consumed off the dashboard
      queue and forwarded over HTTP by the Workflow-Events Consumer.
    bindings:
      sqs:
        queue:
          name: wf-workflow-dash-q
          fifoQueue: false
    messages:
      WorkflowTaskCreated: { $ref: '#/components/messages/WorkflowTaskCreated' }
      WorkflowTaskClaimed: { $ref: '#/components/messages/WorkflowTaskClaimed' }
      WorkflowTaskCompleted: { $ref: '#/components/messages/WorkflowTaskCompleted' }
      WorkflowTaskDeferred: { $ref: '#/components/messages/WorkflowTaskDeferred' }
      WorkflowTaskReassigned: { $ref: '#/components/messages/WorkflowTaskReassigned' }
      WorkflowTaskSuperseded: { $ref: '#/components/messages/WorkflowTaskSuperseded' }
      WorkflowTaskFailed: { $ref: '#/components/messages/WorkflowTaskFailed' }
      WorkflowTaskSlaWarning: { $ref: '#/components/messages/WorkflowTaskSlaWarning' }
      WorkflowTaskSlaBreached: { $ref: '#/components/messages/WorkflowTaskSlaBreached' }
      WorkflowInstancePaused: { $ref: '#/components/messages/WorkflowInstancePaused' }
      WorkflowInstanceResumed: { $ref: '#/components/messages/WorkflowInstanceResumed' }
      WorkflowInstanceCancelled: { $ref: '#/components/messages/WorkflowInstanceCancelled' }
      WorkflowInstanceTerminated: { $ref: '#/components/messages/WorkflowInstanceTerminated' }
      WorkflowInstanceDegraded: { $ref: '#/components/messages/WorkflowInstanceDegraded' }
      WorkflowInstanceFailed: { $ref: '#/components/messages/WorkflowInstanceFailed' }
      WorkflowInstanceFinished: { $ref: '#/components/messages/WorkflowInstanceFinished' }
  llm/generation:
    address: llm-generation-events
    description: >
      Section llm (source llm-retrieval-generation). Published to the
      llm-generation-events topic and forwarded over HTTP by the LLM subsystem's
      own consumer.
    messages:
      GenerationStarted: { $ref: '#/components/messages/GenerationStarted' }
      GenerationProgressed: { $ref: '#/components/messages/GenerationProgressed' }
      OutlineReady: { $ref: '#/components/messages/OutlineReady' }
      SectionCompleted: { $ref: '#/components/messages/SectionCompleted' }
      GenerationCompleted: { $ref: '#/components/messages/GenerationCompleted' }
      GenerationFailed: { $ref: '#/components/messages/GenerationFailed' }
      GenerationCancelled: { $ref: '#/components/messages/GenerationCancelled' }
      GenerationGapReported: { $ref: '#/components/messages/GenerationGapReported' }
      ArtefactRegenerated: { $ref: '#/components/messages/ArtefactRegenerated' }
      ExtractionCompleted: { $ref: '#/components/messages/ExtractionCompleted' }

operations:
  receiveWorkflowEvents:
    action: receive
    channel: { $ref: '#/channels/wf~1workflow~1dash' }
    description: >
      Each event is appended to the Valkey Stream of every recipient it names (and
      the tenant-wide stream when the section sets tenant_admins). 2xx means
      handled, 400 means malformed (not retried), 502 means a transient Valkey
      failure (retried). A redelivery appends a duplicate entry, which clients
      tolerate by the envelope id.
  receiveLLMGenerationEvents:
    action: receive
    channel: { $ref: '#/channels/llm~1generation' }
    description: >
      Each event is appended to the Valkey Stream of every recipient it names (and
      the tenant-wide stream when the section sets tenant_admins). 2xx means
      handled, 400 means malformed (not retried), 502 means a transient Valkey
      failure (retried). A redelivery appends a duplicate entry, which clients
      tolerate by the envelope id.

components:
  messages:
    WorkflowTaskCreated:
      name: WorkflowTaskCreated
      x-lifecycle: { status: active }
      description: A task event. The Workflow Execution Service names the task's assignees as users and its department.
      x-schema-owner: workflow-execution-service
      payload: { $ref: '#/components/schemas/RoutedPayload' }
    WorkflowTaskClaimed:
      name: WorkflowTaskClaimed
      x-lifecycle: { status: active }
      description: A task event. The Workflow Execution Service names the task's assignees as users and its department.
      x-schema-owner: workflow-execution-service
      payload: { $ref: '#/components/schemas/RoutedPayload' }
    WorkflowTaskCompleted:
      name: WorkflowTaskCompleted
      x-lifecycle: { status: active }
      description: A task event. The Workflow Execution Service names the task's assignees as users and its department.
      x-schema-owner: workflow-execution-service
      payload: { $ref: '#/components/schemas/RoutedPayload' }
    WorkflowTaskDeferred:
      name: WorkflowTaskDeferred
      x-lifecycle: { status: active }
      description: A task event. The Workflow Execution Service names the task's assignees as users and its department.
      x-schema-owner: workflow-execution-service
      payload: { $ref: '#/components/schemas/RoutedPayload' }
    WorkflowTaskReassigned:
      name: WorkflowTaskReassigned
      x-lifecycle: { status: active }
      description: A reassignment. The Workflow Execution Service names the previous assignee (when there was one) and the new one as users, and the task's department.
      x-schema-owner: workflow-execution-service
      payload: { $ref: '#/components/schemas/RoutedPayload' }
    WorkflowTaskSuperseded:
      name: WorkflowTaskSuperseded
      x-lifecycle: { status: active }
      description: A task event. The Workflow Execution Service names the task's assignees as users and its department.
      x-schema-owner: workflow-execution-service
      payload: { $ref: '#/components/schemas/RoutedPayload' }
    WorkflowTaskFailed:
      name: WorkflowTaskFailed
      x-lifecycle: { status: active }
      description: A task event. The Workflow Execution Service names the task's assignees as users and its department.
      x-schema-owner: workflow-execution-service
      payload: { $ref: '#/components/schemas/RoutedPayload' }
    WorkflowTaskSlaWarning:
      name: WorkflowTaskSlaWarning
      x-lifecycle: { status: active }
      description: A task event. The Workflow Execution Service names the task's assignees as users and its department.
      x-schema-owner: workflow-execution-service
      payload: { $ref: '#/components/schemas/RoutedPayload' }
    WorkflowTaskSlaBreached:
      name: WorkflowTaskSlaBreached
      x-lifecycle: { status: active }
      description: A task event. The Workflow Execution Service names the task's assignees as users and its department.
      x-schema-owner: workflow-execution-service
      payload: { $ref: '#/components/schemas/RoutedPayload' }
    WorkflowInstancePaused:
      name: WorkflowInstancePaused
      x-lifecycle: { status: active }
      description: An instance event. The Workflow Execution Service names the user who started the instance.
      x-schema-owner: workflow-execution-service
      payload: { $ref: '#/components/schemas/RoutedPayload' }
    WorkflowInstanceResumed:
      name: WorkflowInstanceResumed
      x-lifecycle: { status: active }
      description: An instance event. The Workflow Execution Service names the user who started the instance.
      x-schema-owner: workflow-execution-service
      payload: { $ref: '#/components/schemas/RoutedPayload' }
    WorkflowInstanceCancelled:
      name: WorkflowInstanceCancelled
      x-lifecycle: { status: active }
      description: An instance event. The Workflow Execution Service names the user who started the instance.
      x-schema-owner: workflow-execution-service
      payload: { $ref: '#/components/schemas/RoutedPayload' }
    WorkflowInstanceTerminated:
      name: WorkflowInstanceTerminated
      x-lifecycle: { status: active }
      description: An instance event. The Workflow Execution Service names the user who started the instance.
      x-schema-owner: workflow-execution-service
      payload: { $ref: '#/components/schemas/RoutedPayload' }
    WorkflowInstanceDegraded:
      name: WorkflowInstanceDegraded
      x-lifecycle: { status: active }
      description: An instance event. The Workflow Execution Service names the user who started the instance.
      x-schema-owner: workflow-execution-service
      payload: { $ref: '#/components/schemas/RoutedPayload' }
    WorkflowInstanceFailed:
      name: WorkflowInstanceFailed
      x-lifecycle: { status: active }
      description: An instance event. The Workflow Execution Service names the user who started the instance.
      x-schema-owner: workflow-execution-service
      payload: { $ref: '#/components/schemas/RoutedPayload' }
    WorkflowInstanceFinished:
      name: WorkflowInstanceFinished
      x-lifecycle: { status: active }
      description: An instance event. The Workflow Execution Service names the user who started the instance.
      x-schema-owner: workflow-execution-service
      payload: { $ref: '#/components/schemas/RoutedPayload' }
    GenerationStarted:
      name: GenerationStarted
      x-lifecycle: { status: active }
      description: A generation run was admitted. LLM names the users and departments that follow the run.
      x-schema-owner: llm-retrieval-generation
      payload: { $ref: '#/components/schemas/RoutedPayload' }
    GenerationProgressed:
      name: GenerationProgressed
      x-lifecycle: { status: active }
      description: A stage transition of an asynchronous run; progress_seq orders the run's events. LLM names the users and departments that follow the run.
      x-schema-owner: llm-retrieval-generation
      payload: { $ref: '#/components/schemas/RoutedPayload' }
    OutlineReady:
      name: OutlineReady
      x-lifecycle: { status: active }
      description: The run waits for its outline to be approved. LLM names the users and departments that follow the run.
      x-schema-owner: llm-retrieval-generation
      payload: { $ref: '#/components/schemas/RoutedPayload' }
    SectionCompleted:
      name: SectionCompleted
      x-lifecycle: { status: active }
      description: One section of a run finished. LLM names the users and departments that follow the run.
      x-schema-owner: llm-retrieval-generation
      payload: { $ref: '#/components/schemas/RoutedPayload' }
    GenerationCompleted:
      name: GenerationCompleted
      x-lifecycle: { status: active }
      description: A run finished. LLM names the users and departments that follow the run.
      x-schema-owner: llm-retrieval-generation
      payload: { $ref: '#/components/schemas/RoutedPayload' }
    GenerationFailed:
      name: GenerationFailed
      x-lifecycle: { status: active }
      description: A run failed. LLM names the users and departments that follow the run.
      x-schema-owner: llm-retrieval-generation
      payload: { $ref: '#/components/schemas/RoutedPayload' }
    GenerationCancelled:
      name: GenerationCancelled
      x-lifecycle: { status: active }
      description: A run was cancelled. LLM names the users and departments that follow the run.
      x-schema-owner: llm-retrieval-generation
      payload: { $ref: '#/components/schemas/RoutedPayload' }
    GenerationGapReported:
      name: GenerationGapReported
      x-lifecycle: { status: active }
      description: A run is blocked on a missing required input. LLM names the users and departments that follow the run.
      x-schema-owner: llm-retrieval-generation
      payload: { $ref: '#/components/schemas/RoutedPayload' }
    ArtefactRegenerated:
      name: ArtefactRegenerated
      x-lifecycle: { status: active }
      description: A regeneration produced a new document version. LLM names the users and departments that follow the run.
      x-schema-owner: llm-retrieval-generation
      payload: { $ref: '#/components/schemas/RoutedPayload' }
    ExtractionCompleted:
      name: ExtractionCompleted
      x-lifecycle: { status: active }
      description: A structured extraction finished. LLM names the users and departments that follow the run.
      x-schema-owner: llm-retrieval-generation
      payload: { $ref: '#/components/schemas/RoutedPayload' }

  schemas:
    RoutedPayload:
      type: object
      additionalProperties: true
      required: [recipients]
      properties:
        recipients:
          type: array
          description: >
            Who receives the event. Empty when the producer names no one. A repeated
            entry is written once.
          items: { $ref: '#/components/schemas/Recipient' }
    Recipient:
      type: object
      additionalProperties: true
      required: [kind, id]
      properties:
        kind: { type: string, enum: [user, department] }
        id: { type: string, minLength: 1, maxLength: 128 }
