rule_files:
- rules.yml
evaluation_interval: 1m
tests:
- name: no healthy replica alerts after two minutes
  interval: 1m
  input_series:
  - series: up{job="workflow-stream-gateway", instance="a"}
    values: 1 1 0x10
  alert_rule_test:
  - eval_time: 2m
    alertname: StreamGatewayDown
    exp_alerts: []
  - eval_time: 6m
    alertname: StreamGatewayDown
    exp_alerts:
    - exp_labels:
        severity: critical
      exp_annotations:
        runbook: workflow-stream-gateway/availability
        summary: workflow-stream-gateway has no healthy replica
- name: one healthy replica of two alerts after five minutes
  interval: 1m
  input_series:
  - series: up{job="workflow-stream-gateway", instance="a"}
    values: 1x15
  - series: up{job="workflow-stream-gateway", instance="b"}
    values: 1 1 0x13
  alert_rule_test:
  - eval_time: 4m
    alertname: StreamGatewayReplicasMissing
    exp_alerts: []
  - eval_time: 10m
    alertname: StreamGatewayReplicasMissing
    exp_alerts:
    - exp_labels:
        severity: warning
      exp_annotations:
        runbook: workflow-stream-gateway/availability
        summary: workflow-stream-gateway is below its minimum replica count
  - eval_time: 10m
    alertname: StreamGatewayDown
    exp_alerts: []
- name: a five percent 5xx rate alerts after five minutes, a lower one never
  interval: 1m
  input_series:
  - series: platform_http_requests_total{job="workflow-stream-gateway", status_class="5xx"}
    values: 0+10x20
  - series: platform_http_requests_total{job="workflow-stream-gateway", status_class="2xx"}
    values: 0+90x20
  - series: platform_http_requests_total{job="other-service", status_class="5xx"}
    values: 0+1000x20
  alert_rule_test:
  - eval_time: 12m
    alertname: StreamGatewayHighErrorRate
    exp_alerts:
    - exp_labels:
        severity: warning
      exp_annotations:
        runbook: workflow-stream-gateway/errors
        summary: workflow-stream-gateway 5xx rate above 5%
- name: a 5xx rate at four percent does not alert
  interval: 1m
  input_series:
  - series: platform_http_requests_total{job="workflow-stream-gateway", status_class="5xx"}
    values: 0+4x20
  - series: platform_http_requests_total{job="workflow-stream-gateway", status_class="2xx"}
    values: 0+96x20
  alert_rule_test:
  - eval_time: 15m
    alertname: StreamGatewayHighErrorRate
    exp_alerts: []
- name: a handler panic alerts at once, another service's never
  interval: 1m
  input_series:
  - series: platform_http_panics_total{job="workflow-stream-gateway"}
    values: 0 0 1 1 1
  - series: platform_http_panics_total{job="other-service"}
    values: 0 5 10 15 20
  alert_rule_test:
  - eval_time: 1m
    alertname: StreamGatewayHTTPPanic
    exp_alerts: []
  - eval_time: 3m
    alertname: StreamGatewayHTTPPanic
    exp_alerts:
    - exp_labels:
        job: workflow-stream-gateway
        severity: critical
      exp_annotations:
        runbook: workflow-stream-gateway/panic
        summary: A workflow-stream-gateway handler panicked
- name: refusals for an unreachable Valkey alert after two minutes
  interval: 1m
  input_series:
  - series: workflow_stream_gateway_tickets_minted_total{result="valkey_unavailable"}
    values: 0+1x10
  - series: workflow_stream_gateway_connections_rejected_total{reason="valkey_unavailable"}
    values: 0x10
  alert_rule_test:
  - eval_time: 1m
    alertname: StreamGatewayValkeyUnavailable
    exp_alerts: []
  - eval_time: 5m
    alertname: StreamGatewayValkeyUnavailable
    exp_alerts:
    - exp_labels:
        severity: critical
      exp_annotations:
        runbook: workflow-stream-gateway/valkey
        summary: workflow-stream-gateway cannot reach Valkey and is rejecting clients
- name: sustained ingest errors alert after five minutes
  interval: 1m
  input_series:
  - series: workflow_stream_gateway_internal_events_ingest_total{event_type="workflow.WorkflowTaskCreated", result="error"}
    values: 0+1x15
  - series: workflow_stream_gateway_internal_events_ingest_total{event_type="workflow.WorkflowTaskCreated", result="ok"}
    values: 0+50x15
  alert_rule_test:
  - eval_time: 4m
    alertname: StreamGatewayEventIngestErrors
    exp_alerts: []
  - eval_time: 10m
    alertname: StreamGatewayEventIngestErrors
    exp_alerts:
    - exp_labels:
        severity: warning
      exp_annotations:
        runbook: workflow-stream-gateway/event-ingest
        summary: Sustained errors ingesting forwarded events
- name: clients refused at the connection cap alert after fifteen minutes
  interval: 1m
  input_series:
  - series: workflow_stream_gateway_connections_rejected_total{reason="cap_exceeded"}
    values: 0+1x40
  - series: workflow_stream_gateway_connections_rejected_total{reason="invalid_ticket"}
    values: 0+100x40
  alert_rule_test:
  - eval_time: 10m
    alertname: StreamGatewayConnectionCapRejections
    exp_alerts: []
  - eval_time: 30m
    alertname: StreamGatewayConnectionCapRejections
    exp_alerts:
    - exp_labels:
        severity: warning
      exp_annotations:
        runbook: workflow-stream-gateway/connection-cap
        summary: Clients are hitting the per-user connection cap
- name: invalid tickets alone never alert
  interval: 1m
  input_series:
  - series: workflow_stream_gateway_connections_rejected_total{reason="invalid_ticket"}
    values: 0+100x40
  - series: workflow_stream_gateway_connections_rejected_total{reason="cap_exceeded"}
    values: 0x40
  alert_rule_test:
  - eval_time: 30m
    alertname: StreamGatewayConnectionCapRejections
    exp_alerts: []
