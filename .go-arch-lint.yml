# go-arch-lint configuration — enforces the domain/usecase/adapter/cmd
# layering from the LLD's repo skeleton (docs/lld/workflow_stream_gateway.md §10.1).
#
# Run: go-arch-lint check --project-path .
version: 2
workdir: .

exclude:
  - ".claude"
  - "vendor"

allow:
  depOnAnyVendor: true

components:
  domain:
    in: "internal/domain/**"
  usecase:
    in: "internal/usecase/**"
  config:
    in: "internal/config/**"
  observability:
    in: "internal/observability/**"
  adapter:
    in: "internal/adapter/**"
  cmd:
    in: "cmd/**"

deps:
  usecase:
    mayDependOn:
      - domain
  adapter:
    mayDependOn:
      # Self-reference: internal/adapter/** is one component covering both
      # internal/adapter/inbound/http (router.go) and its own
      # internal/adapter/inbound/http/middleware sub-package — without this,
      # go-arch-lint treats router.go's import of middleware as the
      # component depending on itself and flags it (same pattern
      # execution_service's/definition_service's own peer-leaf components
      # need a self-reference for).
      - adapter
      - domain
      - usecase
      - observability
  cmd:
    mayDependOn:
      - domain
      - usecase
      - adapter
      - config
      - observability
