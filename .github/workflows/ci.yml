# ci-gate: a draft PR, a documentation-only change or a PR labeled "skip-ci"
# skips the expensive jobs below, and every check still reports (skipped counts
# as passed), so no required check is ever left waiting. Draft and skip-ci exist
# only on pull_request events; the documentation-only rule also applies to a push
# to main (it compares the pushed commits). A manual run has no base to compare,
# so it always runs everything.
name: CI

"on":
  push:
    branches: [main]
  pull_request:
    # ready_for_review runs CI when a draft is marked ready; labeled and unlabeled
    # re-run the gate when skip-ci is added to or taken off a PR.
    types: [opened, synchronize, reopened, ready_for_review, labeled, unlabeled]
  workflow_dispatch:

permissions:
  contents: read
  packages: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'
  IMAGE_BASE: ghcr.io/bcbp-solutions-fzc-llc/workflow-stream-gateway

jobs:
  ci-gate:
    name: CI gate
    runs-on: ubuntu-latest
    timeout-minutes: 2
    outputs:
      skip: ${{ steps.decide.outputs.skip }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false

      # docs_only is true when every changed file is documentation: Markdown,
      # Mermaid, .claude/, docs/ (except the API spec under docs/swagger/) or
      # LICENSE. The required checks then report skipped instead of running.
      - id: docs
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          docs_only=false
          if [ -n "$BASE" ] && [ "$BASE" != 0000000000000000000000000000000000000000 ] &&
            files="$(git diff --name-only "$BASE...$HEAD" 2>/dev/null)" && [ -n "$files" ]; then
            code="$(while read -r f; do
              case "$f" in
                docs/swagger/*) echo "$f" ;;
                *.md | *.mmd | .claude/* | docs/* | LICENSE) ;;
                *) echo "$f" ;;
              esac
            done <<<"$files")"
            [ -z "$code" ] && docs_only=true
          fi
          echo "docs_only=$docs_only" >> "$GITHUB_OUTPUT"
          echo "docs_only=$docs_only"

      # skip is true for a draft, a documentation-only change or a PR with the
      # skip-ci label. The reusable Validate workflows are still called and their
      # jobs report skipped, because a check nested in a workflow that is never
      # called never reports and a required check would stay pending; the other
      # jobs report skipped through their own condition.
      - id: decide
        env:
          DRAFT: ${{ github.event_name == 'pull_request' && github.event.pull_request.draft }}
          SKIP_LABEL: ${{ github.event_name == 'pull_request' && contains(github.event.pull_request.labels.*.name, 'skip-ci') }}
          DOCS_ONLY: ${{ steps.docs.outputs.docs_only }}
        run: |
          skip=false
          if [ "$DRAFT" = true ] || [ "$DOCS_ONLY" = true ] || [ "$SKIP_LABEL" = true ]; then skip=true; fi
          echo "skip=$skip" >> "$GITHUB_OUTPUT"
          echo "skip=$skip (draft=$DRAFT, docs_only=$DOCS_ONLY, skip-ci label=$SKIP_LABEL)"

  validate-quality:
    name: Validate / Quality
    needs: [ci-gate]
    uses: ./.github/workflows/validate-quality.yml
    secrets: inherit
    with:
      skip: ${{ needs.ci-gate.outputs.skip == 'true' }}

  validate-test:
    name: Validate / Test
    needs: [ci-gate]
    uses: ./.github/workflows/validate-test.yml
    secrets: inherit
    with:
      skip: ${{ needs.ci-gate.outputs.skip == 'true' }}

  build-image-cache:
    name: Build image (cache)
    needs: [ci-gate]
    if: needs.ci-gate.outputs.skip != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          persist-credentials: false
          token: ${{ secrets.CI_REPO_READ_TOKEN || github.token }}

      - name: Lint Dockerfile
        uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: Dockerfile
          config: .hadolint.yaml

      - name: Check that no credential stays in a layer or a registry cache
        run: scripts/dockerfile-credentials-check.sh

      - uses: docker/setup-buildx-action@v3

      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: ${{ env.IMAGE_BASE }}:${{ github.sha }}
          build-args: BUILD_VERSION=${{ github.sha }}
          secrets: go_private_token=${{ secrets.GO_PRIVATE_TOKEN }}
          cache-from: type=gha,scope=stream-gateway
          cache-to: type=gha,mode=max,scope=stream-gateway

  trivy-cve-scan:
    name: Trivy CVE scan
    needs: [build-image-cache]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          persist-credentials: false
          token: ${{ secrets.CI_REPO_READ_TOKEN || github.token }}

      - uses: docker/setup-buildx-action@v3

      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: ${{ env.IMAGE_BASE }}:${{ github.sha }}
          build-args: BUILD_VERSION=${{ github.sha }}
          secrets: go_private_token=${{ secrets.GO_PRIVATE_TOKEN }}
          cache-from: type=gha,scope=stream-gateway

      - name: Install Trivy
        env:
          TRIVY_VERSION: 0.70.0
        run: |
          set -euo pipefail
          dir="$RUNNER_TEMP/trivy-bin"
          mkdir -p "$dir"
          base="https://github.com/aquasecurity/trivy/releases/download/v${TRIVY_VERSION}"
          archive="trivy_${TRIVY_VERSION}_Linux-64bit.tar.gz"
          curl -fsSL -o "$dir/$archive" "$base/$archive"
          curl -fsSL -o "$dir/checksums.txt" "$base/trivy_${TRIVY_VERSION}_checksums.txt"
          (cd "$dir" && grep " ${archive}\$" checksums.txt | sha256sum -c -)
          tar -xzf "$dir/$archive" -C "$dir" trivy
          echo "$dir" >> "$GITHUB_PATH"

      - name: Scan image
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          skip-setup-trivy: true
          image-ref: ${{ env.IMAGE_BASE }}:${{ github.sha }}
          format: table
          exit-code: '1'
          ignore-unfixed: true
          severity: HIGH,CRITICAL
          cache-dir: .trivy-cache

  smoke-tests:
    name: Smoke tests
    needs: [build-image-cache]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          persist-credentials: false
          token: ${{ secrets.CI_REPO_READ_TOKEN || github.token }}

      - uses: docker/setup-buildx-action@v3

      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: ${{ env.IMAGE_BASE }}:${{ github.sha }}
          build-args: BUILD_VERSION=${{ github.sha }}
          secrets: go_private_token=${{ secrets.GO_PRIVATE_TOKEN }}
          cache-from: type=gha,scope=stream-gateway

      - name: Smoke test the image against Valkey
        env:
          GO_PRIVATE_TOKEN: ${{ secrets.GO_PRIVATE_TOKEN }}
          SMOKE_IMAGE: ${{ env.IMAGE_BASE }}:${{ github.sha }}
        run: bash scripts/smoke-test.sh

  pr-summary:
    name: PR summary
    if: always() && github.event_name == 'pull_request'
    needs: [ci-gate, validate-quality, validate-test, build-image-cache, trivy-cve-scan, smoke-tests]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
          token: ${{ secrets.CI_REPO_READ_TOKEN || github.token }}

      - uses: actions/download-artifact@v4
        with:
          name: coverage
          path: .coverage
        continue-on-error: true

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: false

      - name: Compute coverage percentage
        id: cov
        run: |
          if [ -f .coverage/coverage.out ]; then
            pct=$(go tool cover -func=.coverage/coverage.out | tail -1 | awk '{print $3}')
          else
            pct="n/a"
          fi
          echo "pct=$pct" >> "$GITHUB_OUTPUT"

      - uses: actions/github-script@v7
        env:
          JOB_RESULTS: ${{ toJSON(needs) }}
          COVERAGE_PCT: ${{ steps.cov.outputs.pct }}
        with:
          script: |
            const prSummary = require('./.github/scripts/pr-summary.js');
            await prSummary({ github, context });
