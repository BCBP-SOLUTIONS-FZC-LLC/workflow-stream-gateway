name: Validate / Test

"on":
  workflow_call:
    inputs:
      skip:
        description: 'True for a draft, a documentation-only change or a PR with the skip-ci label; every job then reports skipped, so the required checks pass instead of waiting'
        type: boolean
        required: false
        default: false

permissions:
  contents: read
  packages: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'
  GOPRIVATE: github.com/BCBP-SOLUTIONS-FZC-LLC/*
  GONOSUMDB: github.com/BCBP-SOLUTIONS-FZC-LLC/*

jobs:
  test:
    name: test
    if: ${{ !inputs.skip }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false
          token: ${{ secrets.CI_REPO_READ_TOKEN || github.token }}

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: |
            go.sum
            go.mod

      - name: Configure private module access
        env:
          GO_PRIVATE_TOKEN: ${{ secrets.GO_PRIVATE_TOKEN }}
        run: |
          git config --global credential.helper store
          echo "https://x-access-token:${GO_PRIVATE_TOKEN}@github.com" > ~/.git-credentials
          chmod 600 ~/.git-credentials

      - name: Download modules
        run: go mod download

      - name: Verify modules
        run: go mod verify

      - name: Build
        run: make build

      - name: "Tests: unit and integration (race, merged coverage)"
        run: make test-ci

      - name: Coverage threshold gate
        run: make cover-check-pkg

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage
          path: .coverage/coverage.out
          if-no-files-found: ignore

      - name: Install Hurl
        env:
          HURL_VERSION: 8.1.0
        run: |
          curl -fsSL -o "$RUNNER_TEMP/hurl.deb" "https://github.com/Orange-OpenSource/hurl/releases/download/${HURL_VERSION}/hurl_${HURL_VERSION}_amd64.deb"
          sudo apt-get update -qq
          sudo apt-get install -y -qq "$RUNNER_TEMP/hurl.deb"
          hurl --version

      - name: Cache the Schemathesis download
        uses: actions/cache@v4
        with:
          path: ~/.cache/uv
          key: uv-${{ runner.os }}-${{ hashFiles('Makefile') }}

      - name: Install uv
        run: python3 -m pip install --user uv==0.13.7

      - name: Black-box checks (Hurl and Schemathesis against the running stack)
        run: |
          export PATH="$HOME/.local/bin:$PATH"
          make blackbox

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: blackbox-logs
          path: |
            .coverage/blackbox/*.log
            .coverage/schemathesis/*.xml
          if-no-files-found: ignore
