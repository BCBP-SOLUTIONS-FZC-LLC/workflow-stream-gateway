name: Release

"on":
  push:
    tags: ['v*']

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write
  packages: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'
  GOPRIVATE: github.com/BCBP-SOLUTIONS-FZC-LLC/*
  GONOSUMDB: github.com/BCBP-SOLUTIONS-FZC-LLC/*
  IMAGE_NAME: ghcr.io/bcbp-solutions-fzc-llc/workflow-stream-gateway

jobs:
  changelog-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Require a CHANGELOG entry for the tag
        env:
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          version="${REF_NAME#v}"
          if ! grep -qF "## [${version}]" CHANGELOG.md; then
            echo "No CHANGELOG entry for ${version}. Update CHANGELOG.md before tagging." >&2
            exit 1
          fi

  validate-quality:
    name: Validate / Quality
    needs: [changelog-gate]
    uses: ./.github/workflows/validate-quality.yml
    secrets: inherit

  validate-test:
    name: Validate / Test
    needs: [changelog-gate]
    uses: ./.github/workflows/validate-test.yml
    secrets: inherit

  docker:
    name: Build and push versioned image
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [validate-quality, validate-test]
    outputs:
      digest: ${{ steps.build.outputs.digest }}
      version: ${{ steps.meta.outputs.version }}
    permissions:
      contents: read
      packages: write
      id-token: write   # Cosign keyless signing (Sigstore OIDC) — no AWS involved
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
          token: ${{ secrets.CI_REPO_READ_TOKEN || github.token }}

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute image tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=raw,value=latest,enable=${{ !contains(github.ref_name, '-') }}

      - name: Build and push
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          provenance: true
          sbom: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: BUILD_VERSION=${{ github.ref_name }}
          secrets: go_private_token=${{ secrets.GO_PRIVATE_TOKEN }}
          cache-from: type=registry,ref=${{ env.IMAGE_NAME }}:buildcache
          cache-to: type=registry,ref=${{ env.IMAGE_NAME }}:buildcache,mode=max

      - uses: sigstore/cosign-installer@v3

      - name: Sign and verify image (Cosign keyless)
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          .github/scripts/cosign-sign-verify.sh \
            "^https://github.com/${{ github.repository }}/\.github/workflows/release\.yml@refs/tags/.*$"

  release:
    name: GitHub Release
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    needs: [docker]
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
          token: ${{ secrets.CI_REPO_READ_TOKEN || github.token }}

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${{ github.ref_name }}" --generate-notes
