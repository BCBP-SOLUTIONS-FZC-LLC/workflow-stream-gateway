version: "2"

run:
  go: '1.26'
  concurrency: 1

linters:
  enable:
    - errcheck
    - govet
    - staticcheck
    - unused
    - wrapcheck
    - revive
    - misspell
    - unconvert
    - unparam
    - bodyclose
    - noctx
    - nilerr
    - gosec
    - contextcheck
    - gocritic
    - nolintlint
    - sqlclosecheck
  settings:
    revive:
      rules:
        - name: var-naming
        - name: error-return
        - name: error-strings
        - name: error-naming
        - name: if-return
    gocritic:
      enabled-tags:
        - diagnostic
        - performance
      disabled-checks:
        - hugeParam
        - rangeValCopy
    nolintlint:
      require-explanation: true
      require-specific: true
    wrapcheck:
      ignore-package-globs:
        - github.com/BCBP-SOLUTIONS-FZC-LLC/workflow-stream-gateway/*
  exclusions:
    rules:
      - path: _test\.go
        linters:
          - wrapcheck
          - unparam
          - noctx
          - gosec
          - contextcheck
      - path: ^test/
        linters:
          - noctx
          - gosec

formatters:
  enable:
    - goimports
