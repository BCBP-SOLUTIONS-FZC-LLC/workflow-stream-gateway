{{- $httpRouteEnabled := and .Values.ingress.enabled (eq (.Values.ingress.type | default "Ingress") "HTTPRoute") }}
{{- if $httpRouteEnabled }}
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: SecurityPolicy
metadata:
  name: {{ include "workflow-stream-gateway.fullname" . }}-stream
  labels:
    {{- include "workflow-stream-gateway.labels" . | nindent 4 }}
spec:
  targetRef:
    group: gateway.networking.k8s.io
    kind: HTTPRoute
    name: {{ include "workflow-stream-gateway.fullname" . }}-stream
  {{- if and .Values.ingress.securityPolicy.enabled .Values.ingress.securityPolicy.cors.enabled }}
  {{- include "workflow-stream-gateway.cors" . | nindent 2 }}
  {{- end }}
{{- end }}
