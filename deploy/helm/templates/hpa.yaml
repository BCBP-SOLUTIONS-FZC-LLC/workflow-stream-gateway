{{- if .Values.autoscaling.enabled }}
# CPU/memory-based scaling only — a placeholder until a connection-count
# custom metric is wired up (see values.yaml's autoscaling comment; LLD
# §10.2 explicitly leaves the real scaling signal/target undecided).
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: {{ include "workflow-stream-gateway.fullname" . }}
  labels:
    {{- include "workflow-stream-gateway.labels" . | nindent 4 }}
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: {{ include "workflow-stream-gateway.fullname" . }}
  minReplicas: {{ .Values.autoscaling.minReplicas }}
  maxReplicas: {{ .Values.autoscaling.maxReplicas }}
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 80
{{- end }}
