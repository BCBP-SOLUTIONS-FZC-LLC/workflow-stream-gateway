{{- if and .Values.ingress.enabled (eq (.Values.ingress.type | default "Ingress") "HTTPRoute") }}
{{- $root := . }}
{{- range $route := list (dict "suffix" "tickets" "path" .Values.ingress.paths.tickets) (dict "suffix" "stream" "path" .Values.ingress.paths.stream) }}
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ include "workflow-stream-gateway.fullname" $root }}-{{ $route.suffix }}
  labels:
    {{- include "workflow-stream-gateway.labels" $root | nindent 4 }}
spec:
  parentRefs:
    - name: {{ required "ingress.gateway.name is required when ingress.type is HTTPRoute" $root.Values.ingress.gateway.name }}
      {{- with $root.Values.ingress.gateway.namespace }}
      namespace: {{ . }}
      {{- end }}
      {{- with $root.Values.ingress.gateway.sectionName }}
      sectionName: {{ . }}
      {{- end }}
  {{- if $root.Values.ingress.hosts }}
  hostnames:
    {{- range $root.Values.ingress.hosts }}
    - {{ .host | quote }}
    {{- end }}
  {{- end }}
  rules:
    - matches:
        - path:
            type: Exact
            value: {{ $route.path | quote }}
      backendRefs:
        - name: {{ include "workflow-stream-gateway.fullname" $root }}
          port: {{ $root.Values.service.port }}
{{- end }}
{{- end }}
