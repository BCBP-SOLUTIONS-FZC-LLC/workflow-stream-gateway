{{- if .Values.networkPolicy.enabled }}
# A named-service ingress allow-list, not a blanket same-namespace
# `podSelector: {}` — the gap identified in definition_service's and
# iam-user-profile's own charts, both of which grant every pod in the
# namespace access despite their own LLDs prescribing a named allow-list.
# This service's only legitimate callers are the gateway (ticket-mint
# today; the SSE stream route once its own JWT carve-out lands, LLD §5.2)
# and event_consumer (POST /api/v1/internal/events, LLD §3.2) — no other
# same-namespace pod has any reason to reach this service at all.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "workflow-stream-gateway.fullname" . }}
  labels:
    {{- include "workflow-stream-gateway.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "workflow-stream-gateway.selectorLabels" . | nindent 6 }}
  policyTypes:
    - Ingress
    - Egress

  ingress:
    # Allow API traffic from the ingress controller / gateway namespace.
    # Envoy Gateway: data-plane Envoy proxy pods run in the same namespace
    # as the Gateway resource (not envoy-gateway-system, the control
    # plane) — set ingressControllerNamespaceSelector to that namespace's
    # label and ingressControllerPodSelector to the Envoy pod labels.
    - from:
        - namespaceSelector:
            matchLabels:
              {{- toYaml .Values.networkPolicy.ingressControllerNamespaceSelector | nindent 14 }}
          {{- with .Values.networkPolicy.ingressControllerPodSelector }}
          podSelector:
            matchLabels:
              {{- toYaml . | nindent 14 }}
          {{- end }}
      ports:
        - port: {{ .Values.service.port }}
          protocol: TCP

    # Allow event_consumer specifically — the only same-namespace caller,
    # for POST /api/v1/internal/events (its own x-internal-token is the
    # application-layer guard; this is the network-layer one). If
    # event_consumer runs in a different namespace than this release, add
    # a scoped rule via networkPolicy.additionalIngressRules instead of
    # widening this one.
    - from:
        - podSelector:
            matchLabels:
              {{- toYaml .Values.networkPolicy.eventConsumerPodSelector | nindent 14 }}
      ports:
        - port: {{ .Values.service.port }}
          protocol: TCP

    # Allow Prometheus to scrape /metrics — restricted to the monitoring
    # namespace. Metrics live on a SEPARATE port from the API, so this
    # rule (unlike the two above) does not grant any API access.
    {{- if .Values.networkPolicy.metricsIngress.enabled }}
    - from:
        - namespaceSelector:
            matchLabels:
              {{- toYaml .Values.networkPolicy.metricsIngress.namespaceSelector | nindent 14 }}
          podSelector:
            matchLabels:
              {{- toYaml .Values.networkPolicy.metricsIngress.podSelector | nindent 14 }}
      ports:
        - port: {{ .Values.service.metricsPort }}
          protocol: TCP
    {{- end }}

    {{- with .Values.networkPolicy.additionalIngressRules }}
    {{- toYaml . | nindent 4 }}
    {{- end }}

  egress:
    # Allow DNS resolution (required for all outbound connections).
    - ports:
        - port: 53
          protocol: UDP
        - port: 53
          protocol: TCP

    # Allow Valkey (Redis-protocol) connections — this service's only
    # outbound dependency (LLD §2.3): no Postgres, no AWS SDK calls, no
    # calls to any other in-cluster service.
    - ports:
        - port: 6379
          protocol: TCP

    {{- with .Values.networkPolicy.additionalEgressRules }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
{{- end }}
